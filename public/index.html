<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B3A8C">
<title>Sistem Informasi BPN PKKI</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login hide">
  <form id="lf" autocomplete="on" novalidate>
    <img src="/logo.png" alt="Logo BPN PKKI">
    <h1>Sistem Informasi BPN PKKI</h1>
    <p>Badan Pelayanan Nasional Pembaruan Karismatik Katolik Indonesia</p>
    <div id="lstep"></div>
    <div class="err" id="le" role="alert"></div>
  </form>
</div>

<div id="app" class="shell hide">
  <aside class="side" id="side">
    <div class="brand"><img src="/logo.png" alt=""><div><b>BPN PKKI</b><span>Sistem Informasi</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div class="av" id="meav"></div><div><b id="mename"></b><small id="melevel"></small></div><button id="lo">Keluar</button></div>
  </aside>
  <div class="main">
    <div class="top">
      <div class="top-row">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <div><h1 id="ptitle"></h1><div class="sub" id="psub"></div></div>
        <div class="spacer"></div>
        <button class="ghost" id="rf">Muat ulang</button>
        <button class="ghost" id="pwbtn">Ganti password</button>
        <button class="ghost" onclick="window.print()">Cetak</button>
      </div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<script src="/peta.js"></script>
  <script src="/app.js"></script>
</body>
</html>
